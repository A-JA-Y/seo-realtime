# Hourly ingest, driven from GitHub Actions.
#
# Vercel Hobby's cron allowance only permits daily schedules, so `vercel.json`
# registers exactly one job (`/api/cron/daily`, which chains reconcile → rollup
# → prune) and the hourly work comes from here. requirements.md §9 covers the
# alternatives; this is Option C — free, no third-party scheduler account.
#
# Scheduled workflows can be delayed under GitHub load. That is fine for hourly
# ingest: every job is idempotent and picks up whatever it missed.
name: Hourly ingest

on:
  schedule:
    # :05 past the hour, UTC. Off the hour to avoid GitHub's own peak.
    - cron: '5 * * * *'
  workflow_dispatch:

# A delayed run must not pile up on top of the next one — every job is
# idempotent, but two concurrent SERP batches would claim disjoint target sets
# and double the hourly spend.
concurrency:
  group: hourly-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Search Console hourly pull
        run: |
          curl -fsS --max-time 70 -X POST \
            "${{ secrets.APP_BASE_URL }}/api/cron/ingest-gsc" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Submit due SERP checks
        # Runs even if the Search Console pull failed: they are independent
        # sources, and losing both because one provider is down is worse.
        if: always()
        run: |
          curl -fsS --max-time 70 -X POST \
            "${{ secrets.APP_BASE_URL }}/api/cron/enqueue-serp" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Advance any in-progress backfill
        # Bounded by its own 45s deadline and resumable from per-keyword
        # cursors, so it simply continues next hour if it does not finish.
        if: always()
        run: |
          curl -fsS --max-time 70 -X POST \
            "${{ secrets.APP_BASE_URL }}/api/cron/backfill-gsc" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Rebuild rollups, then evaluate alerts
        # The order is load-bearing and the reason these share one step. §9's
        # baselines come from `daily_rank_rollups`, so an alert run that went
        # first would evaluate today against a rollup that does not exist yet
        # and quietly find nothing — a silent alerting system, which is the
        # failure mode nobody notices.
        #
        # Both are idempotent and both recompute from the per-check rows, so
        # running them hourly costs a little CPU and buys near-realtime alerts
        # instead of once-a-day ones.
        if: always()
        run: |
          curl -fsS --max-time 70 -X POST \
            "${{ secrets.APP_BASE_URL }}/api/cron/rollup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          curl -fsS --max-time 70 -X POST \
            "${{ secrets.APP_BASE_URL }}/api/cron/alerts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
